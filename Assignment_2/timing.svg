<svg xmlns="http://www.w3.org/2000/svg" width="760" height="470" viewBox="0 0 760 470" role="img" aria-labelledby="title description">
  <title id="title">Closest-pair algorithm timings</title>
  <desc id="description">Log-log plot of measured divide-and-conquer and brute-force runtimes. Brute force was stopped before the 16,000-point measurement completed.</desc>
  <rect width="760" height="470" fill="white"/>
  <text x="380" y="27" text-anchor="middle" font-family="sans-serif" font-size="18">Closest-pair runtime (log-log)</text>
  <g stroke="#ddd" stroke-width="1">
    <path d="M90 390H700 M90 328H700 M90 266H700 M90 204H700 M90 142H700 M90 80H700"/>
    <path d="M90 80V390 M191.7 80V390 M293.3 80V390 M395 80V390 M496.7 80V390 M598.3 80V390 M700 80V390"/>
  </g>
  <g fill="#333" font-family="sans-serif" font-size="12">
    <text x="78" y="394" text-anchor="end">0.001</text>
    <text x="78" y="332" text-anchor="end">0.01</text>
    <text x="78" y="270" text-anchor="end">0.1</text>
    <text x="78" y="208" text-anchor="end">1</text>
    <text x="78" y="146" text-anchor="end">10</text>
    <text x="78" y="84" text-anchor="end">100</text>
    <text x="90" y="410" text-anchor="middle">1k</text>
    <text x="191.7" y="410" text-anchor="middle">2k</text>
    <text x="293.3" y="410" text-anchor="middle">4k</text>
    <text x="395" y="410" text-anchor="middle">8k</text>
    <text x="496.7" y="410" text-anchor="middle">16k</text>
    <text x="598.3" y="410" text-anchor="middle">32k</text>
    <text x="700" y="410" text-anchor="middle">64k</text>
    <text x="395" y="445" text-anchor="middle">Number of points (n)</text>
    <text x="20" y="235" text-anchor="middle" transform="rotate(-90 20 235)">Seconds</text>
  </g>
  <polyline fill="none" stroke="#1769aa" stroke-width="2.5" points="90,332.9 191.7,313.8 293.3,294.2 395,269.4 496.7,249.1 598.3,207.4 700,184.7"/>
  <polyline fill="none" stroke="#c53d32" stroke-width="2.5" points="90,247.3 191.7,211 293.3,167.2 395,133.4"/>
  <g fill="#1769aa">
    <circle cx="90" cy="332.9" r="4"/><circle cx="191.7" cy="313.8" r="4"/><circle cx="293.3" cy="294.2" r="4"/><circle cx="395" cy="269.4" r="4"/><circle cx="496.7" cy="249.1" r="4"/><circle cx="598.3" cy="207.4" r="4"/><circle cx="700" cy="184.7" r="4"/>
  </g>
  <g fill="#c53d32">
    <circle cx="90" cy="247.3" r="4"/><circle cx="191.7" cy="211" r="4"/><circle cx="293.3" cy="167.2" r="4"/><circle cx="395" cy="133.4" r="4"/>
  </g>
  <g font-family="sans-serif" font-size="12">
    <path d="M510 35h24" stroke="#1769aa" stroke-width="2.5"/><text x="540" y="39" fill="#333">Divide and conquer</text>
    <path d="M510 54h24" stroke="#c53d32" stroke-width="2.5"/><text x="540" y="58" fill="#333">Brute force</text>
    <text x="500" y="100" fill="#8b2520">Stopped at 60s total budget</text>
  </g>
</svg>
