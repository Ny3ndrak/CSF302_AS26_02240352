<svg xmlns="http://www.w3.org/2000/svg" width="920" height="510" viewBox="0 0 920 510" role="img" aria-labelledby="title description">
  <title id="title">Quicksort timings by input type</title>
  <desc id="description">Log-log chart showing improved quicksort runtimes across random, sorted, and duplicate-heavy input, alongside basic quicksort runs. Triangle markers denote RecursionError times, not completed sorts.</desc>
  <rect width="920" height="510" fill="white"/>
  <text x="460" y="27" text-anchor="middle" font-family="sans-serif" font-size="18">Quicksort runtime by input type (log-log)</text>
  <g stroke="#ddd" stroke-width="1">
    <path d="M110 400H810 M110 374.5H810 M110 289.8H810 M110 205.1H810 M110 120.4H810 M110 80H810"/>
    <path d="M110 80V400 M210 80V400 M310 80V400 M410 80V400 M510 80V400 M610 80V400 M710 80V400"/>
  </g>
  <g fill="#333" font-family="sans-serif" font-size="12">
    <text x="98" y="404" text-anchor="end">0.0005</text>
    <text x="98" y="378.5" text-anchor="end">0.001</text>
    <text x="98" y="293.8" text-anchor="end">0.01</text>
    <text x="98" y="209.1" text-anchor="end">0.1</text>
    <text x="98" y="124.4" text-anchor="end">1</text>
    <text x="98" y="84" text-anchor="end">3</text>
    <text x="110" y="420" text-anchor="middle">1k</text>
    <text x="210" y="420" text-anchor="middle">2k</text>
    <text x="310" y="420" text-anchor="middle">4k</text>
    <text x="410" y="420" text-anchor="middle">8k</text>
    <text x="510" y="420" text-anchor="middle">16k</text>
    <text x="610" y="420" text-anchor="middle">32k</text>
    <text x="710" y="420" text-anchor="middle">64k</text>
    <text x="460" y="454" text-anchor="middle">Number of values (n)</text>
    <text x="22" y="240" text-anchor="middle" transform="rotate(-90 22 240)">Seconds (log scale)</text>
  </g>
  <polyline fill="none" stroke="#1469aa" stroke-width="2.5" points="110,354.9 210,321.3 310,289.9 410,269.5 510,236.8 610,203.0 710,174.4"/>
  <polyline fill="none" stroke="#31834b" stroke-width="2.5" points="110,346.7 210,321.8 310,292.0 410,266.7 510,233.5 610,205.9 710,180.7"/>
  <polyline fill="none" stroke="#cf7600" stroke-width="2.5" points="110,386.8 210,382.4 310,355.4 410,328.1 510,304.2 610,269.4 710,245.4"/>
  <polyline fill="none" stroke="#1469aa" stroke-width="1.8" stroke-dasharray="6 4" points="110,373 210,329.6 310,289.9 410,284.4 510,259 610,221.2 710,190.7"/>
  <polyline fill="none" stroke="#cf7600" stroke-width="1.8" stroke-dasharray="6 4" points="110,327.6 210,294.1 310,233.7 410,189"/>
  <g fill="#1469aa">
    <circle cx="110" cy="354.9" r="3.5"/><circle cx="210" cy="321.3" r="3.5"/><circle cx="310" cy="289.9" r="3.5"/><circle cx="410" cy="269.5" r="3.5"/><circle cx="510" cy="236.8" r="3.5"/><circle cx="610" cy="203" r="3.5"/><circle cx="710" cy="174.4" r="3.5"/>
  </g>
  <g fill="#31834b">
    <circle cx="110" cy="346.7" r="3.5"/><circle cx="210" cy="321.8" r="3.5"/><circle cx="310" cy="292" r="3.5"/><circle cx="410" cy="266.7" r="3.5"/><circle cx="510" cy="233.5" r="3.5"/><circle cx="610" cy="205.9" r="3.5"/><circle cx="710" cy="180.7" r="3.5"/>
  </g>
  <g fill="#cf7600">
    <circle cx="110" cy="386.8" r="3.5"/><circle cx="210" cy="382.4" r="3.5"/><circle cx="310" cy="355.4" r="3.5"/><circle cx="410" cy="328.1" r="3.5"/><circle cx="510" cy="304.2" r="3.5"/><circle cx="610" cy="269.4" r="3.5"/><circle cx="710" cy="245.4" r="3.5"/>
  </g>
  <g fill="#1469aa">
    <circle cx="110" cy="373" r="3.5"/><circle cx="210" cy="329.6" r="3.5"/><circle cx="310" cy="289.9" r="3.5"/><circle cx="410" cy="284.4" r="3.5"/><circle cx="510" cy="259" r="3.5"/><circle cx="610" cy="221.2" r="3.5"/><circle cx="710" cy="190.7" r="3.5"/>
  </g>
  <g fill="#cf7600">
    <circle cx="110" cy="327.6" r="3.5"/><circle cx="210" cy="294.1" r="3.5"/><circle cx="310" cy="233.7" r="3.5"/><circle cx="410" cy="189" r="3.5"/>
  </g>
  <g fill="#b02d24" stroke="#b02d24">
    <path d="M110 226.5l-6 10h12z"/><path d="M210 185.3l-6 10h12z"/><path d="M310 154.5l-6 10h12z"/><path d="M410 124.5l-6 10h12z"/><path d="M510 95.9l-6 10h12z"/>
    <path d="M510 231.2l-6 10h12z"/><path d="M610 187.9l-6 10h12z"/><path d="M710 169.4l-6 10h12z"/>
  </g>
  <g font-family="sans-serif" font-size="11" fill="#333">
    <path d="M748 72h22" stroke="#333" stroke-width="2.5"/><text x="777" y="76">Improved (solid)</text>
    <path d="M748 92h22" stroke="#333" stroke-width="1.8" stroke-dasharray="6 4"/><text x="777" y="96">Basic (dashed)</text>
    <circle cx="759" cy="114" r="4" fill="#31834b"/><text x="777" y="118">Random (blue), sorted (green), duplicates (orange)</text>
    <path d="M759 129l-6 10h12z" fill="#b02d24"/><text x="777" y="139">Basic RecursionError (time-to-failure)</text>
  </g>
</svg>
